[package]
name = "yt-advertisements"
version = "1.0.0"
description = "YT Advertisements desktop operations console"
authors = ["YoTech Digitals"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "yt_advertisements_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
rodio = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
